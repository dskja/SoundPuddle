name: SoundPuddle
options:
  bundleIdPrefix: com.dskja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.0.3"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SoundPuddle:
    type: application
    platform: iOS
    sources:
      - path: SoundPuddle
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dskja.SoundPuddle
        PRODUCT_NAME: SoundPuddle
        INFOPLIST_FILE: SoundPuddle/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: SoundPuddle/Resources/Info.plist
      properties:
        CFBundleDisplayName: SoundPuddle
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fonts/Syne-Bold.ttf
          - Fonts/IBMPlexSans-Regular.ttf
          - Fonts/IBMPlexSans-Medium.ttf
          - Fonts/IBMPlexMono-Regular.ttf
        NSLocalNetworkUsageDescription: SoundPuddle findet und verbindet iPhones im selben Raum für lokale Silent-Disco-Sessions — ohne Internet.
        NSBonjourServices:
          - _soundpuddle._tcp
        NSBluetoothAlwaysUsageDescription: Bluetooth hilft, Sessions aufzubauen, wenn kein gemeinsames WLAN verfügbar ist.
        NSMicrophoneUsageDescription: Das Mikrofon wird nur genutzt, wenn du eine Session hostest und Audio teilst.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
  SoundPuddleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoundPuddleTests
    dependencies:
      - target: SoundPuddle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dskja.SoundPuddleTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SoundPuddle.app/SoundPuddle"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SoundPuddle:
    build:
      targets:
        SoundPuddle: all
        SoundPuddleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoundPuddleTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
