name: Build Unsigned IPA

on:
  push:
    branches: [main, "dskja*"]
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-unsigned-ipa:
    name: SoundPuddle unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcodes:"
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version | tee xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee ios-sdk-version.txt

      - name: Fetch OFL fonts
        run: |
          set -euo pipefail
          mkdir -p SoundPuddle/Fonts
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/syne@latest/latin-700-normal.ttf" -o SoundPuddle/Fonts/Syne-Bold.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans@latest/latin-400-normal.ttf" -o SoundPuddle/Fonts/IBMPlexSans-Regular.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans@latest/latin-500-normal.ttf" -o SoundPuddle/Fonts/IBMPlexSans-Medium.ttf
          curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-400-normal.ttf" -o SoundPuddle/Fonts/IBMPlexMono-Regular.ttf
          ls -la SoundPuddle/Fonts

      - name: Generate App Icon
        run: |
          set -euo pipefail
          python3 << 'PY'
          import struct, zlib
          from pathlib import Path
          W = H = 1024
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          ink, lime = (7, 15, 18), (182, 245, 74)
          rows = []
          cx = cy = W / 2
          r = 280
          for y in range(H):
              row = bytearray([0])
              for x in range(W):
                  dx, dy = x - cx, y - cy
                  d = (dx * dx + dy * dy) ** 0.5
                  if d <= r:
                      t = max(0, min(1, (r - d) / 40))
                      c = tuple(int(ink[i] * (1 - t) + lime[i] * t) for i in range(3))
                  else:
                      c = ink
                  row.extend(c)
              rows.append(bytes(row))
          raw = b"".join(rows)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          out = Path("SoundPuddle/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png)
          print("wrote", out, out.stat().st_size)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release iphoneos (unsigned)
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project SoundPuddle.xcodeproj \
            -scheme SoundPuddle \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build 2>&1 | tee build-unsigned.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "## xcodebuild errors"
            echo '```'
            grep -nE "error:|fatal error:|BUILD FAILED|Command .* failed" build-unsigned.log | head -n 200 || echo "(no matching error lines)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error:" build-unsigned.log | head -n 50 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          exit $STATUS

      - name: Publish build errors to repo
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "# SoundPuddle CI build errors"
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Xcode: $(head -n1 xcode-version.txt 2>/dev/null || true)"
            echo
            echo "## Matching lines"
            echo '```'
            grep -nE "error:|fatal error:|BUILD FAILED|Command .* failed" build-unsigned.log | head -n 200 || true
            echo '```'
            echo
            echo "## Tail"
            echo '```'
            tail -n 200 build-unsigned.log || true
            echo '```'
          } > ci/last-build-errors.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-build-errors.md
          if git diff --cached --quiet; then
            echo "No error file changes"
          else
            git commit -m "ci: capture build errors for ${GITHUB_SHA:0:7} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 1

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SoundPuddle.app"
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SoundPuddle-unsigned.ipa Payload
          ls -lh SoundPuddle-unsigned.ipa
          echo "IPA_SIZE=$(wc -c < SoundPuddle-unsigned.ipa | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Job summary
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "## SoundPuddle unsigned IPA"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Xcode: $(head -n1 xcode-version.txt)"
            echo "- iOS SDK: $(cat ios-sdk-version.txt)"
            echo "- IPA bytes: ${IPA_SIZE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SoundPuddle-unsigned-ipa
          path: SoundPuddle-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Fast-forward main
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/dskjasoundpuddle-61ba'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/ff.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"force\":false}")
          cat /tmp/ff.json
          echo
          test "$HTTP" = "200"
          echo "main fast-forwarded to ${GITHUB_SHA}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoundPuddle-unsigned-build-log
          path: |
            build-unsigned.log
            xcode-version.txt
            ios-sdk-version.txt
          if-no-files-found: warn
          retention-days: 14
